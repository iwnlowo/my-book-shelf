<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>我的書架</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",

button,
input,
textarea,
select {

}

button {

}

.container {
  width: 100%;

  margin: auto;

/* =========================
   頁面
========================= */

  display: none;
}

.page.active {
  display: block;
}

/* =========================
   首頁
========================= */

.home {
  text-align: center;
}

.mascot {
  font-size: 90px;
  margin-top: 25px;
  margin-bottom: 8px;
}

.welcome {

}

.quote {

}

.menu {

.menu-button {

}

  box-shadow: 0 5px 16px rgba(0,0,0,0.08);

  transform: scale(0.98);
}

.menu-icon {
  font-size: 27px;
  margin-right: 8px;
}

/* =========================
   標題
========================= */

h1 {
  text-align: center;
  margin: 10px 0 25px;
}

h2 {
  margin-top: 0;
}

h3 {
  margin-top: 24px;
}

/* =========================
   按鈕
========================= */

.back-button {
  background: white;
  border: 1px solid #eee;
  border-radius: 12px;
  padding: 10px 14px;
  color: #444;
}

.add-button {
  width: 100%;
  background: #444;
  color: white;
  border: none;
  border-radius: 14px;
  padding: 15px;
  font-size: 16px;
  margin-bottom: 20px;
}

.primary-button {
  background: #444;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 10px 16px;
  margin-right: 6px;
}

.secondary-button {
  background: #eee;
  color: #444;
  border: none;
  border-radius: 10px;
  padding: 10px 16px;
}

/* =========================
   表單
========================= */

.form {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.hidden {
  display: none !important;
}

label {
  display: block;
  font-weight: 600;
  margin-top: 10px;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  margin: 6px 0 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  background: white;
  color: #444;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

.preview {
  width: 100px;
  height: 140px;
  object-fit: cover;
  border-radius: 8px;
  display: none;
  margin-bottom: 15px;
}

/* =========================
   搜尋
========================= */

.search {
  margin-top: 5px;
  margin-bottom: 15px;
}/* =========================
   篩選
========================= */

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 18px;
}

.filter-button {
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 8px 12px;
  color: #555;
}

.filter-button.active {
  background: #444;
  color: white;
  border-color: #444;
}

/* =========================
   書籍
========================= */

.book {
  background: white;
  padding: 16px;
  border-radius: 16px;
  margin-bottom: 14px;
  display: flex;
  gap: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.cover {
  width: 85px;
  height: 120px;
  object-fit: cover;
  border-radius: 6px;
  background: #eee;
  flex-shrink: 0;
}

.book-info {
  flex: 1;
  min-width: 0;
}

.book h3 {
  margin: 0 0 8px;
  word-break: break-word;
}

.book p {
  margin: 6px 0;
  color: #777;
  line-height: 1.5;
  word-break: break-word;
}

.book-actions {
  margin-top: 12px;
}

.edit-button {
  background: #444;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 8px 12px;
  margin-right: 5px;
}

.delete-button {
  background: #eee;
  color: #555;
  border: none;
  border-radius: 10px;
  padding: 8px 12px;
}

.empty {
  text-align: center;
  color: #aaa;
  padding: 40px 20px;
}

/* =========================
   待閱／推薦／心得
========================= */

.coming-soon {
  text-align: center;
  padding: 50px 20px;
  background: white;
  border-radius: 18px;
  color: #888;
  line-height: 1.8;
}

@media (max-width: 500px) {

  .container {
    padding: 20px 14px 50px;
  }

  .mascot {
    font-size: 75px;
  }

  .welcome {
    font-size: 22px;
  }

  .book {
    padding: 13px;
  }

  .cover {
    width: 72px;
    height: 105px;
  }

}

</style>
</head>

</div><script>

/* =========================
   書籍資料
========================= */

let books = [];

try {
  const savedBooks =
    localStorage.getItem("myBooks");

  if (savedBooks) {
    const parsed =
      JSON.parse(savedBooks);

    if (Array.isArray(parsed)) {
      books = parsed;
    }
  }

} catch (error) {
  console.log(
    "讀取書籍資料失敗：",
    error
  );

}


/* =========================
   全域狀態
========================= */

let editingId = null;

let selectedCover = null;

let selectedCategory = "全部";

let selectedStatus = "全部";


/* =========================
   儲存資料
========================= */

function saveBooks() {

  try {

    localStorage.setItem(
      "myBooks",
      JSON.stringify(books)
    );

    return true;

  } catch (error) {

    alert(
      "儲存失敗，可能是瀏覽器儲存空間不足。"
    );

    return false;

  }

}


/* =========================
   頁面切換
========================= */

function showPage(pageId) {

  document
    .querySelectorAll(".page")
    .forEach(function(page) {

      page.classList.remove("active");

    });


  const target =
    document.getElementById(pageId);


  if (!target) {
    return;
  }


  target.classList.add("active");


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });


  if (pageId === "shelf") {

    displayBooks();

  }

}


/* =========================
   新增書籍
========================= */

function showAddForm() {

  editingId = null;

  selectedCover = null;


  document.getElementById(
    "formTitle"
  ).textContent = "新增書籍";


  document.getElementById(
    "title"
  ).value = "";


  document.getElementById(
    "author"
  ).value = "";


  document.getElementById(
    "category"
  ).value = "小說";


  document.getElementById(
    "status"
  ).value = "未讀";


  document.getElementById(
    "rating"
  ).value = "0";


  document.getElementById(
    "review"
  ).value = "";


  document.getElementById(
    "cover"
  ).value = "";


  const preview =
    document.getElementById("preview");


  preview.src = "";

  preview.style.display =
    "none";


  document
    .getElementById("bookForm")
    .classList.remove("hidden");


  document
    .getElementById("title")
    .focus();

}


/* =========================
   關閉表單
========================= */

function hideForm() {

  document
    .getElementById("bookForm")
    .classList.add("hidden");


  editingId = null;

  selectedCover = null;

}


/* =========================
   書封上傳
========================= */

document
  .getElementById("cover")
  .addEventListener(
    "change",
    function(event) {

      const file =
        event.target.files[0];


      if (!file) {
        return;
      }


      if (
        !file.type.startsWith("image/")
      ) {

        alert(
          "請選擇圖片檔案。"
        );

        event.target.value = "";

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          selectedCover =
            e.target.result;


          const preview =
            document.getElementById(
              "preview"
            );


          preview.src =
            selectedCover;


          preview.style.display =
            "block";

        };


      reader.readAsDataURL(file);

    }
  );


/* =========================
   編輯書籍
========================= */

function editBook(id) {

  const book =
    books.find(function(item) {

      return String(item.id) ===
        String(id);

    });


  if (!book) {

    alert(
      "找不到這本書。"
    );

    return;

  }


  editingId =
    book.id;


  /*
   * 保留原本書封。
   * 如果沒有重新選圖片，
   * 儲存時就繼續使用這張。
   */

  selectedCover =
    book.cover || null;


  document.getElementById(
    "formTitle"
  ).textContent = "編輯書籍";


  document.getElementById(
    "title"
  ).value =
    book.title || "";


  document.getElementById(
    "author"
  ).value =
    book.author || "";


  document.getElementById(
    "category"
  ).value =
    book.category || "其他";


  document.getElementById(
    "status"
  ).value =
    book.status || "未讀";


  document.getElementById(
    "rating"
  ).value =
    book.rating || "0";


  document.getElementById(
    "review"
  ).value =
    book.review || "";


  document.getElementById(
    "cover"
  ).value = "";


  const preview =
    document.getElementById(
      "preview"
    );


  if (book.cover) {

    preview.src =
      book.cover;

    preview.style.display =
      "block";

  } else {

    preview.src = "";

    preview.style.display =
      "none";

  }


  document
    .getElementById("bookForm")
    .classList.remove("hidden");


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================
   儲存書籍
========================= */

function saveBook() {

  const title =
    document
      .getElementById("title")
      .value
      .trim();


  const author =
    document
      .getElementById("author")
      .value
      .trim();


  const category =
    document
      .getElementById("category")
      .value;


  const status =
    document
      .getElementById("status")
      .value;


  const rating =
    document
      .getElementById("rating")
      .value;


  const review =
    document
      .getElementById("review")
      .value
      .trim();


  if (!title) {

    alert(
      "請先輸入書名！"
    );

    document
      .getElementById("title")
      .focus();

    return;

  }


  /* =====================
     新增
  ===================== */

  if (editingId === null) {

    const newBook = {

      id:
        Date.now() +
        Math.random(),

      title:
        title,

      author:
        author,

      category:
        category,

      status:
        status,

      rating:
        rating,

      review:
        review,

      cover:
        selectedCover

    };


    books.push(newBook);

  }


  /* =====================
     編輯
  ===================== */

  else {

    const book =
      books.find(function(item) {

        return String(item.id) ===
          String(editingId);

      });


    if (!book) {

      alert(
        "找不到要編輯的書籍。"
      );

      return;

    }


    book.title =
      title;

    book.author =
      author;

    book.category =
      category;

    book.status =
      status;

    book.rating =
      rating;

    book.review =
      review;


    /*
     * 只有重新選擇書封時，
     * 才更新書封。
     */

    if (selectedCover !== null) {

      book.cover =
        selectedCover;

    }

  }


  const saved =
    saveBooks();


  if (!saved) {
    return;
  }


  hideForm();

  displayBooks();

}


/* =========================
   刪除書籍
========================= */

function deleteBook(id) {

  const confirmed =
    window.confirm(
      "確定要刪除這本書嗎？"
    );


  if (!confirmed) {
    return;
  }


  books =
    books.filter(function(book) {

      return String(book.id) !==
        String(id);

    });


  saveBooks();

  displayBooks();

}


/* =========================
   分類篩選
========================= */

function setCategory(category) {

  selectedCategory =
    category;


  document
    .querySelectorAll(
      "#categoryFilters .filter-button"
    )
    .forEach(function(button) {

      button.classList.remove(
        "active"
      );


      if (
        button.dataset.category ===
        category
      ) {

        button.classList.add(
          "active"
        );

      }

    });


  displayBooks();

}


/* =========================
   閱讀狀態篩選
========================= */

function setStatus(status) {

  selectedStatus =
    status;


  document
    .querySelectorAll(
      "#statusFilters .filter-button"
    )
    .forEach(function(button) {

      button.classList.remove(
        "active"
      );


      if (
        button.dataset.status ===
        status
      ) {

        button.classList.add(
          "active"
        );

      }

    });


  displayBooks();

}


/* =========================
   搜尋
========================= */

function searchBooks() {

  displayBooks();

}/* =========================
   顯示書籍
========================= */

function displayBooks() {

  const container =
    document.getElementById("books");

  const searchInput =
    document.getElementById("search");

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();


  const filteredBooks =
    books.filter(function(book) {

      const title =
        String(book.title || "")
          .toLowerCase();

      const author =
        String(book.author || "")
          .toLowerCase();


      const matchesSearch =
        title.includes(keyword) ||
        author.includes(keyword);


      const matchesCategory =
        selectedCategory === "全部" ||
        (book.category || "其他") ===
          selectedCategory;


      const matchesStatus =
        selectedStatus === "全部" ||
        (book.status || "未讀") ===
          selectedStatus;


      return (
        matchesSearch &&
        matchesCategory &&
        matchesStatus
      );

    });


  /* 沒有書 */

  if (filteredBooks.length === 0) {

    container.innerHTML = `
      <div class="empty">
        目前沒有符合條件的書籍 📚
      </div>
    `;

    return;

  }


  /* 清空 */

  container.innerHTML = "";


  /* 一本一本建立 */

  filteredBooks.forEach(function(book) {

    const bookElement =
      document.createElement("div");

    bookElement.className =
      "book";


    /* =====================
       書封
    ===================== */

    if (book.cover) {

      const img =
        document.createElement("img");

      img.className =
        "cover";

      img.src =
        book.cover;

      img.alt =
        "《" +
        (book.title || "書籍") +
        "》書封";


      bookElement.appendChild(img);

    }

    else {

      const emptyCover =
        document.createElement("div");

      emptyCover.className =
        "cover";


      bookElement.appendChild(
        emptyCover
      );

    }


    /* =====================
       書籍內容
    ===================== */

    const info =
      document.createElement("div");

    info.className =
      "book-info";


    /* 書名 */

    const title =
      document.createElement("h3");

    title.textContent =
      book.title || "未命名書籍";


    info.appendChild(title);


    /* 作者 */

    const author =
      document.createElement("p");

    author.textContent =
      "作者：" +
      (book.author || "未填寫");


    info.appendChild(author);


    /* 分類 */

    const category =
      document.createElement("p");

    category.textContent =
      "分類：" +
      (book.category || "其他");


    info.appendChild(category);


    /* 狀態 */

    const status =
      document.createElement("p");

    status.textContent =
      "狀態：" +
      (book.status || "未讀");


    info.appendChild(status);


    /* 評分 */

    const rating =
      document.createElement("p");


    const ratingNumber =
      Number(book.rating || 0);


    rating.textContent =
      "評分：" +
      (
        ratingNumber > 0
          ? "⭐".repeat(ratingNumber)
          : "尚未評分"
      );


    info.appendChild(rating);


    /* 閱讀心得 */

    if (book.review) {

      const review =
        document.createElement("p");


      review.textContent =
        "📝 " +
        book.review;


      info.appendChild(review);

    }


    /* =====================
       按鈕
    ===================== */

    const actions =
      document.createElement("div");

    actions.className =
      "book-actions";


    /* 編輯 */

    const editButton =
      document.createElement("button");

    editButton.className =
      "edit-button";

    editButton.textContent =
      "✏️ 編輯";


    editButton.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        editBook(book.id);

      }
    );


    actions.appendChild(
      editButton
    );


    /* 刪除 */

    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-button";

    deleteButton.textContent =
      "🗑️ 刪除";


    deleteButton.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        deleteBook(book.id);

      }
    );


    actions.appendChild(
      deleteButton
    );


    info.appendChild(actions);


    bookElement.appendChild(info);


    /* =====================
       點擊整本書
    ===================== */

    bookElement.addEventListener(
      "click",
      function() {

        editBook(book.id);

      }
    );


    container.appendChild(
      bookElement
    );

  });

}
