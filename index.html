<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>我的書架</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #fff7fa;
      color: #444;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 24px 16px 50px;
    }

    /* 首頁 */

    .home {
      text-align: center;
    }

    .mascot {
      font-size: 90px;
      margin-top: 20px;
      margin-bottom: 5px;
    }

    .welcome {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .quote {
      color: #999;
      margin-bottom: 35px;
    }

    /* 首頁選單 */

    .menu {
      display: grid;
      gap: 14px;
    }

    .menu-button {
      background: white;
      border: none;
      border-radius: 18px;
      padding: 20px;
      font-size: 18px;
      text-align: left;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
      cursor: pointer;
    }

    .menu-button:hover {
      transform: translateY(-2px);
    }

    .menu-icon {
      font-size: 26px;
      margin-right: 8px;
    }

    /* 書架 */

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    h1 {
      text-align: center;
    }

    .back-button {
      background: white;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .add-button {
      width: 100%;
      background: #444;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin: 6px 0 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
    }

    .form {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .hidden {
      display: none;
    }

    .search {
      margin-bottom: 15px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 15px;
    }

    .filter-button {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .filter-button.active {
      background: #444;
      color: white;
    }

    .book {
      background: white;
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 14px;
      display: flex;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .cover {
      width: 80px;
      height: 115px;
      object-fit: cover;
      border-radius: 6px;
      background: #eee;
      flex-shrink: 0;
    }

    .book-info {
      flex: 1;
      min-width: 0;
    }

    .book h3 {
      margin: 0 0 6px;
    }

    .book p {
      margin: 5px 0;
      color: #777;
    }

    .edit-button {
      background: #444;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .delete-button {
      background: #eee;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .preview {
      width: 100px;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      display: none;
      margin-bottom: 15px;
    }

    .empty {
      text-align: center;
      color: #aaa;
      padding: 30px;
    }

  </style>
</head>

<body>

<div class="container">


  <!-- ==================== -->
  <!-- 首頁 -->
  <!-- ==================== -->

  <section id="home" class="page active home">

    <div class="mascot">
      🎀🐰
    </div>

    <div class="welcome">
      歡迎回到我的書架
    </div>

    <div class="quote">
      今天也讀一點點吧。📖
    </div>


    <div class="menu">

      <button
        class="menu-button"
        onclick="showPage('shelf')">

        <span class="menu-icon">📚</span>

        我的書架

      </button>


      <button
        class="menu-button"
        onclick="alert('待閱書單即將開放！')">

        <span class="menu-icon">📋</span>

        待閱書單

      </button>


      <button
        class="menu-button"
        onclick="alert('推薦書單即將開放！')">

        <span class="menu-icon">💡</span>

        推薦書單

      </button>


      <button
        class="menu-button"
        onclick="alert('閱讀心得即將開放！')">

        <span class="menu-icon">📝</span>

        閱讀心得

      </button>

    </div>

  </section>


  <!-- ==================== -->
  <!-- 我的書架 -->
  <!-- ==================== -->

  <section id="shelf" class="page">

    <button
      class="back-button"
      onclick="showPage('home')">

      ← 回首頁

    </button>


    <h1>📚 我的書架</h1>


    <button
      class="add-button"
      onclick="showAddForm()">

      ＋ 新增書籍

    </button>


    <!-- 新增／編輯 -->

    <div
      id="form"
      class="form hidden">

      <h2 id="formTitle">
        新增書籍
      </h2>


      <label>書名</label>

      <input
        id="title"
        type="text"
        placeholder="例如：臺灣漫遊錄">


      <label>作者</label>

      <input
        id="author"
        type="text"
        placeholder="作者姓名">


      <label>書籍分類</label>

      <select id="category">

        <option value="小說">小說</option>
        <option value="散文">散文</option>
        <option value="詩集">詩集</option>
        <option value="非虛構">非虛構</option>
        <option value="心理">心理</option>
        <option value="哲學">哲學</option>
        <option value="歷史">歷史</option>
        <option value="社會">社會</option>
        <option value="傳記">傳記</option>
        <option value="其他">其他</option>

      </select>


      <label>閱讀狀態</label>

      <select id="status">

        <option value="未讀">未讀</option>
        <option value="閱讀中">閱讀中</option>
        <option value="已讀">已讀</option>
        <option value="暫停">暫停</option>

      </select>


      <label>評分</label>

      <select id="rating">

        <option value="0">尚未評分</option>
        <option value="1">⭐</option>
        <option value="2">⭐⭐</option>
        <option value="3">⭐⭐⭐</option>
        <option value="4">⭐⭐⭐⭐</option>
        <option value="5">⭐⭐⭐⭐⭐</option>

      </select>


      <label>書封</label>

      <input
        id="cover"
        type="file"
        accept="image/*"
        onchange="previewCover(event)">


      <img
        id="preview"
        class="preview">


      <label>我的心得</label>

      <textarea
        id="review"
        placeholder="寫下你的閱讀感受……"></textarea>


      <button
        onclick="saveBook()">

        💾 儲存

      </button>


      <button
        onclick="hideForm()">

        取消

      </button>

    </div>


    <!-- 搜尋 -->

    <input
      class="search"
      id="search"
      type="text"
      placeholder="🔍 搜尋書名或作者……"
      oninput="displayBooks()">


    <!-- 分類 -->

    <h3>🏷️ 書籍分類</h3>

    <div class="filters">

      <button
        class="filter-button active"
        onclick="setCategory('全部', this)">
        全部
      </button>

      <button
        class="filter-button"
        onclick="setCategory('小說', this)">
        小說
      </button>

      <button
        class="filter-button"
        onclick="setCategory('散文', this)">
        散文
      </button>

      <button
        class="filter-button"
        onclick="setCategory('詩集', this)">
        詩集
      </button>

      <button
        class="filter-button"
        onclick="setCategory('非虛構', this)">
        非虛構
      </button>

      <button
        class="filter-button"
        onclick="setCategory('心理', this)">
        心理
      </button>

      <button
        class="filter-button"
        onclick="setCategory('哲學', this)">
        哲學
      </button>

      <button
        class="filter-button"
        onclick="setCategory('歷史', this)">
        歷史
      </button>

      <button
        class="filter-button"
        onclick="setCategory('社會', this)">
        社會
      </button>

      <button
        class="filter-button"
        onclick="setCategory('傳記', this)">
        傳記
      </button>

      <button
        class="filter-button"
        onclick="setCategory('其他', this)">
        其他
      </button>

    </div>


    <!-- 狀態 -->

    <h3>📖 閱讀狀態</h3>

    <div class="filters">

      <button
        class="filter-button active"
        onclick="setStatus('全部', this)">
        全部
      </button>

      <button
        class="filter-button"
        onclick="setStatus('未讀', this)">
        未讀
      </button>

      <button
        class="filter-button"
        onclick="setStatus('閱讀中', this)">
        閱讀中
      </button>

      <button
        class="filter-button"
        onclick="setStatus('已讀', this)">
        已讀
      </button>

      <button
        class="filter-button"
        onclick="setStatus('暫停', this)">
        暫停
      </button>

    </div>


    <div id="books"></div>

  </section>

</div>


<script>

  let books =
    JSON.parse(
      localStorage.getItem("myBooks")
    ) || [];


  let editingId = null;

  let selectedCover = null;

  let selectedCategory = "全部";

  let selectedStatus = "全部";


  function showPage(page) {

    document
      .querySelectorAll(".page")
      .forEach(
        p => p.classList.remove("active")
      );

    document
      .getElementById(page)
      .classList.add("active");

    if (page === "shelf") {
      displayBooks();
    }

    window.scrollTo(0, 0);

  }


  function saveBooks() {

    localStorage.setItem(
      "myBooks",
      JSON.stringify(books)
    );

  }


  function showAddForm() {

    editingId = null;

    selectedCover = null;

    document.getElementById(
      "formTitle"
    ).textContent = "新增書籍";


    document.getElementById(
      "title"
    ).value = "";


    document.getElementById(
      "author"
    ).value = "";


    document.getElementById(
      "category"
    ).value = "小說";


    document.getElementById(
      "status"
    ).value = "未讀";


    document.getElementById(
      "rating"
    ).value = "0";


    document.getElementById(
      "review"
    ).value = "";


    document.getElementById(
      "cover"
    ).value = "";


    document.getElementById(
      "preview"
    ).style.display = "none";


    document.getElementById(
      "form"
    ).classList.remove("hidden");

  }


  function editBook(id) {

    const book =
      books.find(
        book => book.id === id
      );

    if (!book) return;


    editingId = id;

    selectedCover =
      book.cover || null;


    document.getElementById(
      "formTitle"
    ).textContent = "編輯書籍";


    document.getElementById(
      "title"
    ).value = book.title;


    document.getElementById(
      "author"
    ).value =
      book.author || "";


    document.getElementById(
      "category"
    ).value =
      book.category || "其他";


    document.getElementById(
      "status"
    ).value =
      book.status || "未讀";


    document.getElementById(
      "rating"
    ).value =
      book.rating || "0";


    document.getElementById(
      "review"
    ).value =
      book.review || "";


    document.getElementById(
      "cover"
    ).value = "";


    const preview =
      document.getElementById(
        "preview"
      );


    if (book.cover) {

      preview.src =
        book.cover;

      preview.style.display =
        "block";

    } else {

      preview.style.display =
        "none";

    }


    document.getElementById(
      "form"
    ).classList.remove("hidden");

    window.scrollTo(0, 0);

  }


  function previewCover(event) {

    const file =
      event.target.files[0];

    if (!file) return;


    const reader =
      new FileReader();


    reader.onload =
      function(e) {

        selectedCover =
          e.target.result;


        const preview =
          document.getElementById(
            "preview"
          );


        preview.src =
          selectedCover;


        preview.style.display =
          "block";

      };


    reader.readAsDataURL(file);

  }


  function saveBook() {

    const title =
      document
        .getElementById("title")
        .value
        .trim();


    const author =
      document
        .getElementById("author")
        .value
        .trim();


    const category =
      document
        .getElementById("category")
        .value;


    const status =
      document
        .getElementById("status")
        .value;


    const rating =
      document
        .getElementById("rating")
        .value;


    const review =
      document
        .getElementById("review")
        .value
        .trim();


    if (!title) {

      alert("請先輸入書名！");

      return;

    }


    if (editingId === null) {

      books.push({

        id: Date.now(),

        title,

        author,

        category,

        status,

        rating,

        review,

        cover: selectedCover

      });

    } else {

      const book =
        books.find(
          book =>
            book.id === editingId
        );


      if (book) {

        book.title = title;

        book.author = author;

        book.category = category;

        book.status = status;

        book.rating = rating;

        book.review = review;

        book.cover = selectedCover;

      }

    }


    saveBooks();


    editingId = null;

    selectedCover = null;


    hideForm();

    displayBooks();

  }


  function hideForm() {

    document
      .getElementById("form")
      .classList.add("hidden");

  }


  function deleteBook(id) {

    if (
      !confirm(
        "確定要刪除這本書嗎？"
      )
    ) {

      return;

    }


    books =
      books.filter(
        book =>
          book.id !== id
      );


    saveBooks();

    displayBooks();

  }


  function setCategory(
    category,
    button
  ) {

    selectedCategory =
      category;


    const categoryButtons =
      document.querySelectorAll(
        ".filters"
      )[0]
      .querySelectorAll("button");


    categoryButtons.forEach(
      btn =>
        btn.classList.remove(
          "active"
        )
    );


    button.classList.add(
      "active"
    );


    displayBooks();

  }


  function setStatus(
    status,
    button
  ) {

    selectedStatus =
      status;


    const statusButtons =
      document.querySelectorAll(
        ".filters"
      )[1]
      .querySelectorAll("button");


    statusButtons.forEach(
      btn =>
        btn.classList.remove(
          "active"
        )
    );


    button.classList.add(
      "active"
    );


    displayBooks();

  }


  function displayBooks() {

    const container =
      document.getElementById(
        "books"
      );


    const keyword =
      document
        .getElementById(
          "search"
        )
        .value
        .toLowerCase();


    const filteredBooks =
      books.filter(book => {

        const matchesSearch =
          book.title
            .toLowerCase()
            .includes(keyword) ||

          (book.author || "")
            .toLowerCase()
            .includes(keyword);


        const matchesCategory =
          selectedCategory ===
            "全部" ||

          (book.category ||
            "其他") ===
            selectedCategory;


        const matchesStatus =
          selectedStatus ===
            "全部" ||

          book.status ===
            selectedStatus;


        return (
          matchesSearch &&
          matchesCategory &&
          matchesStatus
        );

      });


    if (
      filteredBooks.length === 0
    ) {

      container.innerHTML =
        `<div class="empty">
          目前沒有符合條件的書籍 📚
        </div>`;

      return;

    }


    container.innerHTML =
      filteredBooks
        .map(book => {

          const stars =
            book.rating > 0

              ? "⭐".repeat(
                  Number(
                    book.rating
                  )
                )

              : "尚未評分";


          const cover =
            book.cover

              ? `<img
                  class="cover"
                  src="${book.cover}"
                  alt="書封">`

              : `<div
                  class="cover">
                </div>`;


          return `

            <div class="book">

              ${cover}

              <div class="book-info">

                <h3>
                  ${book.title}
                </h3>

                <p>
                  作者：
                  ${book.author ||
                    "未填寫"}
                </p>

                <p>
                  分類：
                  ${book.category ||
                    "其他"}
                </p>

                <p>
                  狀態：
                  ${book.status}
                </p>

                <p>
                  評分：
                  ${stars}
                </p>

                ${
                  book.review

                    ? `<p>
                        📝
                        ${book.review}
                      </p>`

                    : ""
                }


                <button
                  class="edit-button"
                  onclick=
                    "editBook(${book.id})">

                  ✏️ 編輯

                </button>


                <button
                  class="delete-button"
                  onclick=
                    "deleteBook(${book.id})">

                  🗑️ 刪除

                </button>

              </div>

            </div>

          `;

        })
        .join("");

  }


  displayBooks();

</script>

</body>
</html>
